        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

<body class="bg-[#f5f5f7] flex flex-col items-center justify-center min-h-screen p-4 antialiased">

    <!-- タイマーメイン画面 -->
    <div class="bg-white rounded-[2.5rem] shadow-[0_20px_40px_-15px_rgba(0,0,0,0.05)] w-full max-w-sm p-10 text-center flex flex-col items-center border border-gray-100/50 mb-6">

        <div class="text-xs font-semibold tracking-widest text-gray-400 uppercase mb-8">Pomodoro</div>

        <div class="relative flex justify-center items-center mb-10 w-full">
            <!-- 背景の円 -->
            <svg class="transform -rotate-90 w-72 h-72" viewBox="0 0 288 288">
                <circle cx="144" cy="144" r="130" stroke="currentColor" stroke-width="3" fill="transparent" class="text-gray-100" />
                <!-- プログレスリング -->
                <circle id="progress-ring" cx="144" cy="144" r="130" stroke="#0F4C3A" stroke-width="6" stroke-linecap="round" fill="transparent" />
            </svg>

            <!-- 中央のテキスト -->
            <div class="absolute flex flex-col items-center justify-center pointer-events-none mt-2">
                <span id="time-display" class="text-7xl font-light text-gray-800 tabular-nums tracking-tighter">25:00</span>
                <span id="status-text" class="text-sm font-medium text-gray-400 mt-2">作業に集中</span>
            </div>
        </div>

        <div class="flex justify-center items-center gap-4 mb-8 w-full">
            <!-- スタート/一時停止ボタン -->
            <button id="start-btn" onclick="toggleTimer()" class="flex-1 py-4 rounded-full text-white font-medium text-lg bg-deepgreen hover:bg-deepgreen-light transition-all shadow-sm active:scale-95">
                スタート
            </button>

            <!-- リセットボタン -->
            <button onclick="resetTimer()" class="w-16 h-16 flex justify-center items-center rounded-full bg-[#f5f5f7] hover:bg-gray-200 text-gray-600 transition-all active:scale-95" title="リセット" aria-label="リセット">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>

        <div class="bg-[#f5f5f7] rounded-full py-2.5 px-6 flex items-center justify-center gap-3">
            <span class="text-gray-400 font-medium text-xs uppercase tracking-wider">Completed</span>
            <div id="session-count" class="font-semibold text-deepgreen flex items-baseline gap-1">
                <span class="text-lg">0</span> <span class="text-xs">Pods</span>
            </div>
        </div>
    </div>

    <!-- ポモドーロタイマーとは ボタン -->
    <button onclick="showModal()" class="text-sm text-gray-500 hover:text-gray-800 transition-colors underline underline-offset-4 decoration-gray-300">
        ポモドーロタイマーとは
    </button>

    <!-- 説明ポップアップ (モーダル) -->
    <div id="welcome-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity duration-300 opacity-0">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 transform scale-95 transition-transform duration-300">
            <div class="text-center mb-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-2">Pomodoro Timer<br><span class="text-sm text-gray-500 font-normal">（ポモドーロタイマー）とは</span></h2>
            </div>

            <div class="space-y-4 text-sm text-gray-600 leading-relaxed">
                <p>
                    <span class="font-bold text-gray-800 border-b-2 border-deepgreen/30">作業の集中力と生産性を高める</span>ための時間管理メソッド「ポモドーロ・テクニック」を実践するためのタイマーです。
                </p>
                <p>
                    1980年代後半にイタリアの起業家フランチェスコ・シリロ氏によって考案されました。<br>
                    彼が学生時代にトマト型（イタリア語でポモドーロ）のキッチンタイマーを使って勉強していたことからこの名がついています。
                </p>

                <div class="bg-gray-50 rounded-xl p-4 mt-6">
                    <h3 class="font-semibold text-gray-800 mb-2">使い方説明</h3>
                    <p class="text-xs text-gray-500 mb-3">基本の仕組みと動き（1サイクル）</p>
                    <p class="font-medium text-deepgreen bg-deepgreen/5 p-3 rounded-lg text-center">
                        「25分の作業」＋「5分の休憩」＝ 30分<br>
                        <span class="text-xs text-gray-500 font-normal mt-1 block">を1つの単位（1ポモドーロ）として繰り返します。</span>
                    </p>
                </div>
            </div>

            <button onclick="closeModal()" class="w-full mt-8 py-3 rounded-xl bg-deepgreen text-white font-medium hover:bg-deepgreen-light transition-colors active:scale-95">
                とじる
            </button>
        </div>
    </div>

    <script>
        // 定数設定（25分, 5分, 15分）
        const MODES = {
            pomodoro:   { time: 25 * 60, label: "作業に集中", done: "作業終了。休憩しましょう" },
            shortBreak: { time: 5 * 60,  label: "短い休憩",   done: "休憩終了。作業に戻りましょう" },
            longBreak:  { time: 15 * 60, label: "長い休憩",   done: "1セット完了。お疲れさまでした" }
        };
        const COLOR_WORK = '#0F4C3A';  // ディープグリーン
        const COLOR_BREAK = '#3b82f6'; // 休憩はブルー
        const ICON_URL = 'https://kwnfactory2004.github.io/webtools-aresenal/logo.png';

        // 状態管理
        // endTime: 動作中は終了予定時刻(ms)、停止中は null
        // 残り時間は「終了予定時刻 − 現在時刻」で毎回計算するので、
        // 画面を消したりタブを切り替えたりしても時間がずれない
        let currentMode = 'pomodoro';
        let remainingMs = MODES.pomodoro.time * 1000;
        let endTime = null;
        let tickId = null;
        let completedSessions = 0;
        let audioCtx = null;
        let wakeLock = null;

        // DOM要素の取得
        const timeDisplay = document.getElementById('time-display');
        const statusText = document.getElementById('status-text');
        const startBtn = document.getElementById('start-btn');
        const sessionCountDisplay = document.getElementById('session-count');
        const progressRing = document.getElementById('progress-ring');

        // SVGリングの円周を計算して設定
        const radius = progressRing.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;
        progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
        progressRing.style.strokeDashoffset = 0;

        const isRunning = () => endTime !== null;

        // 画面の表示を更新する
        function updateDisplay() {
            const totalSec = Math.max(0, Math.ceil(remainingMs / 1000));
            const minutes = Math.floor(totalSec / 60);
            const seconds = totalSec % 60;
            const formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            timeDisplay.textContent = formattedTime;
            document.title = `${formattedTime} - ${MODES[currentMode].label}`;

            const percentage = Math.max(0, remainingMs) / (MODES[currentMode].time * 1000);
            progressRing.style.strokeDashoffset = circumference - percentage * circumference;
        }

        function updateSessionCount() {
            const podText = completedSessions <= 1 && completedSessions !== 0 ? "Pod" : "Pods";
            sessionCountDisplay.innerHTML = `<span class="text-lg">${completedSessions}</span> <span class="text-xs">${podText}</span>`;
        }

        function setButton(state) {
            const labels = { start: 'スタート', pause: '一時停止', resume: '再開' };
            startBtn.textContent = labels[state];
            const running = state === 'pause';
            startBtn.classList.toggle('bg-orange-500', running);
            startBtn.classList.toggle('hover:bg-orange-600', running);
            startBtn.classList.toggle('bg-deepgreen', !running);
            startBtn.classList.toggle('hover:bg-deepgreen-light', !running);
        }

        // モードを切り替える
        function setMode(mode) {
            currentMode = mode;
            remainingMs = MODES[mode].time * 1000;
            statusText.textContent = MODES[mode].label;
            progressRing.setAttribute('stroke', mode === 'pomodoro' ? COLOR_WORK : COLOR_BREAK);
        }

        // 一定間隔で残り時間を再計算する
        function tick() {
            if (!isRunning()) return;
            const now = Date.now();
            let finishedMessage = null;

            // バックグラウンド中に複数のフェーズが終わっていても正しく追いつく
            while (isRunning() && now >= endTime) {
                finishedMessage = MODES[currentMode].done;
                advancePhase(endTime);
            }
            if (isRunning()) remainingMs = endTime - now;

            updateDisplay();
            if (finishedMessage) notifyFinish(finishedMessage);
        }

        // フェーズ終了時の処理（自動進行）。at = そのフェーズが終わった時刻
        function advancePhase(at) {
            if (currentMode === 'pomodoro') {
                completedSessions++;
                updateSessionCount();
                const next = completedSessions % 4 === 0 ? 'longBreak' : 'shortBreak';
                setMode(next);
                endTime = at + MODES[next].time * 1000;
            } else if (completedSessions >= 4) {
                resetTimer(); // 1セット終了でリセット
            } else {
                setMode('pomodoro');
                endTime = at + MODES.pomodoro.time * 1000;
            }
        }

        // タイマーの開始・一時停止
        function toggleTimer() {
            if (isRunning()) {
                // 一時停止
                remainingMs = Math.max(0, endTime - Date.now());
                endTime = null;
                clearInterval(tickId);
                tickId = null;
                setButton('resume');
                releaseWakeLock();
                updateDisplay();
                return;
            }

            // 開始（状態を先に確定させるので、連打しても二重に動かない）
            endTime = Date.now() + remainingMs;
            clearInterval(tickId);
            tickId = setInterval(tick, 250);
            setButton('pause');

            // 以下はボタン操作の直後でないと許可されないため、ここで準備する
            unlockAudio();
            requestWakeLock();
            askNotificationPermission();
        }

        // タイマーのリセット
        function resetTimer() {
            endTime = null;
            clearInterval(tickId);
            tickId = null;
            releaseWakeLock();

            setMode('pomodoro');
            setButton('start');
            completedSessions = 0;
            updateSessionCount();
            updateDisplay();
        }

        // ---- アラーム音（ブラウザ標準の Web Audio を使用） ----
        function unlockAudio() {
            try {
                if (!audioCtx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return;
                    audioCtx = new AC();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {
                console.warn('オーディオの初期化に失敗しました', e);
            }
        }

        function playAlarm() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 440; // A4
                gain.gain.setValueAtTime(0.0001, t);
                gain.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.03, t + 0.8);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 3.3);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 3.4);
            } catch (e) {
                console.warn('アラームを再生できませんでした', e);
            }
        }

        // ---- 終了の通知（音・バイブ・通知） ----
        function notifyFinish(message) {
            playAlarm();
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            if (document.visibilityState !== 'visible' && 'Notification' in window && Notification.permission === 'granted') {
                try { new Notification('Pomodoro Timer', { body: message, icon: ICON_URL }); } catch (e) {}
            }
        }

        function askNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                try { Notification.requestPermission(); } catch (e) {}
            }
        }

        // ---- 動作中は画面を消さない（対応ブラウザのみ） ----
        async function requestWakeLock() {
            if (!('wakeLock' in navigator) || wakeLock) return;
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
                if (!isRunning()) releaseWakeLock(); // 取得中に停止された場合
            } catch (e) {
                wakeLock = null;
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().catch(() => {});
                wakeLock = null;
            }
        }

        // 画面に戻ってきたらすぐ表示を追いつかせ、画面消灯防止を取り直す
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                tick();
                if (isRunning()) requestWakeLock();
            }
        });

        // 初回表示設定
        updateDisplay();

        // ---- モーダル ----
        const modal = document.getElementById('welcome-modal');
        const modalPanel = modal.querySelector('div');

        function showModal() {
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalPanel.classList.remove('scale-95');
                modalPanel.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalPanel.classList.remove('scale-100');
            modalPanel.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                try { localStorage.setItem('pomodoroVisited', 'true'); } catch (e) {}
            }, 300);
        }

        // 初回訪問時のみモーダルを表示
        let visited = false;
        try { visited = !!localStorage.getItem('pomodoroVisited'); } catch (e) {}
        if (!visited) showModal();
    </script>
  <script>
    // PWA:オフラインでも開けるように Service Worker を登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.warn('Service Worker の登録に失敗しました', err);
        });
      });
    }
  </script>
</body>
</html>
